name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it, but never run two at
# once against the same environment. Matches the mcu-timeline workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      - name: Validate the curated tables
        run: npm run data:validate

      - name: Pipeline tests
        run: npm run data:test

      - name: Bundle matches the curated data
        # The bundle is committed, so it can drift from the tables it came from.
        # Compared field by field rather than with git diff: the spring layout
        # lands a fraction of a unit apart on a different architecture, which is
        # not staleness, and a raw diff cannot tell the two apart.
        run: npm run data:verify

      - name: Leakage suite
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
