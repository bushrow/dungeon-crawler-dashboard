name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      - name: Validate the curated tables
        run: npm run data:validate

      - name: Pipeline tests
        run: npm run data:test

      - name: Bundle matches the curated data
        # The bundle is committed, so it can drift from the tables it came from.
        # Recompiling and finding a diff means somebody edited a CSV without
        # rebuilding, and the apps are serving stale data.
        run: |
          npm run data
          git diff --exit-code -- data/dist \
            || (echo "::error::data/dist is stale; run 'npm run data' and commit the result" && exit 1)

      - name: Leakage suite
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
