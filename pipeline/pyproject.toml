[project]
name = "dcc-pipeline"
version = "0.1.0"
description = "Validate, lay out, and compile the DCC corpus into a shipped bundle"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
