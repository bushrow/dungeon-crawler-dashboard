<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browse &middot; Dungeon Crawler Carl</title>
    <meta
      name="description"
      content="Look up anyone and anything in Dungeon Crawler Carl, scoped to the floor you have read to."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%23202329%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%23b29127%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%226.5%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%2324808f%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2210%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%239a3a70%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="browse">
      <div class="browse__main">
        <div class="finder">
          <label class="finder__field">
            <span class="visually-hidden">Search the corpus</span>
            <input
              type="search"
              data-search
              placeholder="Search people, items, skills, places&hellip;"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div class="finder__types" data-types></div>
        </div>
        <section class="panel">
          <div class="panel__head">
            <h2 class="eyebrow" data-result-label>Everything open at this floor</h2>
            <span class="eyebrow" data-result-count></span>
          </div>
          <ul class="results" data-results></ul>
        </section>
      </div>
      <aside class="panel browse__record" data-record></aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
