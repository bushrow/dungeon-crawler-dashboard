<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger &middot; Dungeon Crawler Carl</title>
    <meta
      name="description"
      content="What every class and item costs, what it does, and how much of that is actually known."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%23202329%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%23b29127%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%226.5%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%2324808f%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2210%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%239a3a70%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="ledger">
      <div class="ledger__main">
        <div class="views" role="tablist" aria-label="Ledger view">
          <button class="views__tab" role="tab" data-view="sheets">Character sheets</button>
          <button class="views__tab" role="tab" data-view="catalogue">Catalogue</button>
        </div>

        <div data-panel="sheets">
          <nav class="crawlers" data-crawlers aria-label="Crawlers"></nav>
          <section class="panel sheet" data-sheet></section>
        </div>

        <div data-panel="catalogue" hidden>
          <section class="panel">
            <div class="panel__head">
              <h2 class="eyebrow">Effect by cost</h2>
              <span class="eyebrow" data-facet-count></span>
            </div>
            <div class="facets" data-facets></div>
            <p class="note facets__caption">
              Effect scale is comparable inside a category and not across them, so each category
              is drawn on its own. Most costs here are a kind rather than an amount, so the
              horizontal axis is the kind of cost.
            </p>
          </section>

          <section class="panel" style="margin-top:var(--pad)">
            <div class="panel__head">
              <h2 class="eyebrow">Classes and items</h2>
              <span class="eyebrow" data-row-count></span>
            </div>
            <div class="table__scroll">
              <table class="table" data-table>
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <aside class="ledger__rail">
        <section class="panel" data-record-panel>
          <div class="panel__head"><h2 class="eyebrow">Record</h2></div>
          <div data-record></div>
        </section>
        <section class="panel" data-filter-panel>
          <div class="panel__head"><h2 class="eyebrow">Filters</h2></div>
          <div class="filters" data-filters></div>
        </section>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
