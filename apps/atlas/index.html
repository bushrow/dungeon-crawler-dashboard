<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="description"
      content="Who is connected to whom in Dungeon Crawler Carl, at the floor you have read to."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="atlas">
      <section class="panel atlas__graph">
        <div class="panel__head">
          <h2 class="eyebrow">Relationships</h2>
          <span class="eyebrow" data-count></span>
        </div>
        <div class="atlas__canvas">
          <svg preserveAspectRatio="xMidYMid meet"
               role="img" aria-label="Relationship graph">
            <g data-layer="edges"></g>
            <g data-layer="nodes"></g>
          </svg>
        </div>
        <ul class="legend" data-legend></ul>
      </section>
      <aside class="panel atlas__card" data-card></aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
