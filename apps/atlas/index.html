<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas &middot; Dungeon Crawler Carl</title>
    <meta
      name="description"
      content="Who is connected to whom in Dungeon Crawler Carl, at the floor you have read to."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="../../icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../icon-180.png" />
    <meta name="theme-color" content="#202329" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="atlas">
      <section class="panel atlas__graph">
        <div class="panel__head">
          <h2 class="eyebrow">Relationships</h2>
          <span class="eyebrow" data-count></span>
        </div>
        <div class="atlas__canvas">
          <svg preserveAspectRatio="xMidYMid meet"
               role="img" aria-label="Relationship graph">
            <g data-layer="edges"></g>
            <g data-layer="nodes"></g>
          </svg>
        </div>
        <ul class="legend" data-legend></ul>
      </section>
      <aside class="panel atlas__card" data-card></aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
